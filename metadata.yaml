help: |
  此插件为“我会永远陪着你”插件的拓展程序，请到其拓展页进行配置。

  “我会画给你看”为“我会永远陪着你”提供图像生成能力，包括文生图、自拍、人像改图、参考图库和多后端配置。

  安装并启用后，陪伴插件中的生图请求会自动接入本插件；运行状态与配置统一在陪伴插件的“陪伴面板”中管理。

  首次启用时可读取旧版陪伴插件中的生图配置、额度、参考图库和生成归档，便于平滑迁移。本扩展不提供独立页面或脱离陪伴主插件的运行入口。
