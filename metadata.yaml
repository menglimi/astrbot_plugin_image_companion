help: |
  “我会画给你看”提供 AstrBot 图像生成能力，包括文生图、自拍、人像改图、参考图库和多后端配置。

  与“我会永远陪着你”同时安装并启用后，陪伴插件中的生图请求会自动接入本插件；原有指令、会话范围和消息投递顺序保持不变。

  首次启用时可读取旧版陪伴插件中的生图配置、额度、参考图库和生成归档，便于平滑迁移。未安装陪伴插件时，本插件仍可作为独立图像生成扩展使用，具体入口取决于当前 AstrBot 环境和已注册工具。
